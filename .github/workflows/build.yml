name: Build APKs

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Accept Android SDK licenses
        run: yes | sdkmanager --licenses > /dev/null || true
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7
      - name: Build debug APKs
        run: gradle assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: TVPad-phone-apk
          path: app/build/outputs/apk/debug/app-debug.apk
      - uses: actions/upload-artifact@v4
        with:
          name: TVPad-TV-helper-apk
          path: tv/build/outputs/apk/debug/tv-debug.apk
      - name: Rename APKs
        run: |
          mkdir -p out
          cp app/build/outputs/apk/debug/app-debug.apk out/TVPad-phone.apk
          cp tv/build/outputs/apk/debug/tv-debug.apk out/TVPad-TV-helper.apk
      - name: Publish release with plain APK files
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Latest build
          body: Download TVPad-phone.apk for your phone and TVPad-TV-helper.apk for the TV. No unzipping needed.
          files: |
            out/TVPad-phone.apk
            out/TVPad-TV-helper.apk
